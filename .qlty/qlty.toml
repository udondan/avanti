# Configuration for the Qlty CLI and Qlty Cloud.
#
# Guide: https://qlty.sh/d/config
# Reference: https://qlty.sh/d/qlty-toml
config_version = "0"

exclude_patterns = [
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/.yarn/**",
  "**/*.d.ts",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  "**/db/**",
  "**/deps/**",
  "**/dist/**",
  "**/extern/**",
  "**/external/**",
  "**/generated/**",
  "**/Godeps/**",
  "**/gradlew/**",
  "**/mvnw/**",
  "**/node_modules/**",
  "**/protos/**",
  "**/seed/**",
  "**/target/**",
  "**/templates/**",
  "**/testdata/**",
  "**/vendor/**",
  "**/.claude/**",
  # Generated by release-please
  "CHANGELOG.md",
  "test/fixtures/**",
]

test_patterns = [
  "**/test/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

[smells]
mode = "block"

# Qlty doesn't know bun.lock as a lockfile yet.
[file_types.osv-scanner]
globs = ["**/bun.lock"]

# radarlint sometimes loses type information and then reports required
# assertions as unnecessary. ESLint's no-unnecessary-type-assertion enforces
# the same rule with full type information.
[[triage]]
match.rules = ["radarlint-js:typescript:S4325"]
set.ignored = true

[[source]]
name = "default"
default = true

[[plugin]]
name = "actionlint"

[[plugin]]
name = "checkov"

# typescript is needed so typescript-eslint can resolve types. Without it,
# every typed rule reports types that could not be resolved.
#
# ESLint and knip need the project's dependencies installed: the typed rules
# resolve imported types from node_modules, and knip loads the tool configs
# and maps binaries to packages. Qlty Cloud builds ("build" trigger) don't
# install dependencies, so both run everywhere except there; the CI qlty job
# installs dependencies and runs them.
[[plugin]]
name = "eslint"
package_file = "package.json"
package_filters = ["eslint", "prettier", "typescript"]
triggers = ["manual", "ide", "agent", "pre-commit", "pre-push"]

[[plugin]]
name = "knip"
triggers = ["manual", "ide", "agent", "pre-commit", "pre-push"]

[[plugin]]
name = "markdownlint"

[[plugin]]
name = "osv-scanner"

[[plugin]]
name = "oxc"

[[plugin]]
name = "prettier"
package_file = "package.json"
package_filters = ["prettier"]

[[plugin]]
name = "radarlint-js"

[[plugin]]
name = "trivy"

[[plugin]]
name = "trufflehog"

[[plugin]]
name = "yamllint"

[[plugin]]
name = "zizmor"
