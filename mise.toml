[tools]
node = "lts"
bun = "1.3.12"

[tasks.install]
description = "Install dependencies"
run = ["bun install", "mise run install-hooks"]

[tasks."install-hooks"]
description = "Symlink tracked hooks into .git/hooks"
run = "ln -sf ../../hooks/pre-commit .git/hooks/pre-commit"

[tasks.build]
description = "Compile TypeScript to dist/"
run = "bun run build"

[tasks.dev]
description = "Watch mode — recompile on changes"
run = "bun run dev"

[tasks.test]
description = "Run all tests"
run = "bun run test"

[tasks."test:watch"]
description = "Run tests in watch mode"
run = "bun run test:watch"

[tasks.typecheck]
description = "Type-check without emitting files"
run = "bun run typecheck"

[tasks.lint]
description = "Run ESLint"
run = "bun run lint"

[tasks.format]
description = "Format all files with Prettier"
run = "bun run format"

[tasks."format:check"]
description = "Check formatting without writing"
run = "bun run format:check"
