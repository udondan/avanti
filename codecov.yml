---
codecov:
  # The Coverage job of the Test workflow waits for the Codecov checks, so
  # Codecov must not wait for the other checks in turn.
  require_ci_to_pass: false
  notify:
    wait_for_ci: false
    # Both legs of the test matrix (Linux and Windows) upload coverage. Codecov
    # only reports once both arrived, so the Coverage job doesn't read a
    # partial result.
    after_n_builds: 2

coverage:
  status:
    project:
      default:
        # The coverage of the whole project must stay at 99 % or more.
        target: 99%
    patch:
      default:
        # Every line a pull request changes must be tested.
        target: 100%
