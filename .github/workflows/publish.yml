name: Publish

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Set bisect version
        run: |
          git log -1 --format='Building %H %s'
          npm version "0.28.0-bisect.${{ github.run_number }}.${{ github.run_attempt }}" --no-git-tag-version
          node --version
          npm --version
          echo "--- npm config"
          npm config list
          echo "--- ~/.npmrc"
          cat ~/.npmrc 2>/dev/null || echo "(none)"

      - name: Stage publish
        run: npm stage publish --access public --provenance --tag bisect --loglevel silly

      - name: Dump npm debug log
        if: always()
        run: cat ~/.npm/_logs/*-debug-0.log 2>/dev/null || echo "(no debug log)"
