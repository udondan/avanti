---
name: Publish

on:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org

      # Works around https://github.com/actions/setup-node/issues/1551:
      # setup-node always writes an empty _authToken line to .npmrc when
      # NODE_AUTH_TOKEN isn't set, which makes npm skip OIDC trusted
      # publishing and try (and fail) classic token auth instead.
      - name: Remove empty npm auth token from generated .npmrc
        run: sed -i '/_authToken/d' "${NPM_CONFIG_USERCONFIG:-$RUNNER_TEMP/.npmrc}"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Debug npm OIDC auth state
        run: |
          echo "npm version: $(npm --version)"
          echo "node version: $(node --version)"
          echo "NPM_CONFIG_USERCONFIG=$NPM_CONFIG_USERCONFIG"
          echo "--- .npmrc content ---"
          cat "${NPM_CONFIG_USERCONFIG:-$RUNNER_TEMP/.npmrc}" || echo "(missing)"
          echo "--- npm config list ---"
          npm config list
          echo "ACTIONS_ID_TOKEN_REQUEST_URL set: $([ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && echo yes || echo no)"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN set: $([ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ] && echo yes || echo no)"

      - name: Publish
        run: npm publish --access public --provenance --loglevel silly

      - name: Dump npm debug log
        if: always()
        run: cat /home/runner/.npm/_logs/*-debug-*.log || echo "(no debug log found)"
