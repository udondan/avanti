---
name: Test

on:
  workflow_dispatch:
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            src:
              - src/**
              - test/**
              - package.json
              - bun.lock
              - tsconfig*.json
              - eslint.config.mjs
              - prettier.config.mjs
              - .github/workflows/test.yml

  test:
    runs-on: ${{ matrix.os }}
    needs: [changes]
    if: always() && (needs.changes.result == 'skipped' || (needs.changes.result == 'success' && needs.changes.outputs.src == 'true'))
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Build, lint, and format checks only run on Linux.
      # The build script uses chmod which is not available on Windows,
      # and code-quality gates only need to run once.
      - name: Build
        if: runner.os != 'Windows'
        run: bun run build

      - name: Type check
        if: runner.os != 'Windows'
        run: bun run typecheck

      - name: Lint
        if: runner.os != 'Windows'
        run: bun run lint

      - name: Format check
        if: runner.os != 'Windows'
        run: bun run format:check

      - name: Test
        run: bun run test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}

  required:
    runs-on: ubuntu-latest
    needs: [changes, test]
    if: always()
    steps:
      - name: Check result
        run: |
          if [[ "${{ needs.changes.result }}" == "failure" || "${{ needs.changes.result }}" == "cancelled" || "${{ needs.test.result }}" == "failure" || "${{ needs.test.result }}" == "cancelled" ]]; then
            exit 1
          fi
