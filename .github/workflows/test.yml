---
name: Test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            src:
              - src/**
              - test/**
              - package.json
              - bun.lock
              - tsconfig*.json
              - eslint.config.mjs
              - prettier.config.mjs
              - .github/workflows/test.yml

  test:
    runs-on: ${{ matrix.os }}
    needs: [changes]
    if: always() && (needs.changes.result == 'skipped' || (needs.changes.result == 'success' && needs.changes.outputs.src == 'true'))
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Build, lint, and format checks only run on Linux.
      # The build script uses chmod which is not available on Windows,
      # and code-quality gates only need to run once.
      - name: Build
        if: runner.os != 'Windows'
        run: bun run build

      - name: Type check
        if: runner.os != 'Windows'
        run: bun run typecheck

      - name: Lint
        if: runner.os != 'Windows'
        run: bun run lint

      - name: Format check
        if: runner.os != 'Windows'
        run: bun run format:check

      - name: Test
        run: bun run test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}

  integration-tests-vault:
    runs-on: ubuntu-latest
    needs: [changes]
    if: always() && (needs.changes.result == 'skipped' || (needs.changes.result == 'success' && needs.changes.outputs.src == 'true'))
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start Vault
        run: |
          docker run -d \
            --name vault \
            --cap-add IPC_LOCK \
            -p 8200:8200 \
            -e VAULT_DEV_ROOT_TOKEN_ID=root \
            -e VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200 \
            hashicorp/vault:latest
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8200/v1/sys/health; then
              echo "Vault is ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Vault failed to start after 60s"
              docker logs vault
              exit 1
            fi
            sleep 2
          done

      - name: Seed Vault test secrets
        run: |
          # KV v2 on default 'secret/' mount (enabled in dev mode)
          curl -sf -X POST http://127.0.0.1:8200/v1/secret/data/myapp/db \
            -H "X-Vault-Token: root" -H "Content-Type: application/json" \
            -d '{"data":{"username":"admin","password":"s3cr3t"}}'
          # Enable KV v1 mount at 'kv1/'
          curl -sf -X POST http://127.0.0.1:8200/v1/sys/mounts/kv1 \
            -H "X-Vault-Token: root" -H "Content-Type: application/json" \
            -d '{"type":"kv","options":{"version":"1"}}'
          # KV v1 secret (fields at top level, no 'data' wrapper)
          curl -sf -X POST http://127.0.0.1:8200/v1/kv1/myapp/token \
            -H "X-Vault-Token: root" -H "Content-Type: application/json" \
            -d '{"apikey":"v1key123"}'
          # Create a policy scoped only to the test paths
          POLICY=$(printf 'path "secret/data/myapp/*" { capabilities = ["read"] }\npath "secret/myapp/*" { capabilities = ["read"] }\npath "kv1/myapp/*" { capabilities = ["read"] }')
          curl -sf -X PUT http://127.0.0.1:8200/v1/sys/policies/acl/avanti-read \
            -H "X-Vault-Token: root" -H "Content-Type: application/json" \
            -d "$(jq -n --arg p "$POLICY" '{"policy":$p}')"
          # Create a restricted token and export it for the test step
          RESTRICTED_TOKEN=$(curl -sf -X POST http://127.0.0.1:8200/v1/auth/token/create \
            -H "X-Vault-Token: root" -H "Content-Type: application/json" \
            -d '{"policies":["avanti-read"],"ttl":"1h"}' | jq -r '.auth.client_token')
          echo "VAULT_TOKEN=$RESTRICTED_TOKEN" >> "$GITHUB_ENV"

      - name: Run Vault integration tests
        run: bunx vitest run test/vault-integration.test.ts
        env:
          VAULT_ADDR: http://127.0.0.1:8200

  required:
    runs-on: ubuntu-latest
    needs: [changes, test, integration-tests-vault]
    if: always()
    steps:
      - name: Check result
        run: |
          if [[ "${{ needs.changes.result }}" == "failure" || \
                "${{ needs.changes.result }}" == "cancelled" || \
                "${{ needs.test.result }}" == "failure" || \
                "${{ needs.test.result }}" == "cancelled" || \
                "${{ needs.integration-tests-vault.result }}" == "failure" || \
                "${{ needs.integration-tests-vault.result }}" == "cancelled" ]]; then
            exit 1
          fi
